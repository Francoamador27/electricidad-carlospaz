# Configuración del Worker de la API (Cloudflare). Los secretos NO van acá:
# se cargan en el dashboard (producción) o en .dev.vars (local). Ver DEPLOY.md.
name = "voltis-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# La API vive en el mismo dominio que el sitio: sin CORS en producción.
routes = [
  { pattern = "electricidadcarlospaz.proyectoswebsite.com/api/*", zone_name = "proyectoswebsite.com" },
  { pattern = "electricidadcarlospaz.proyectoswebsite.com/admin/api/*", zone_name = "proyectoswebsite.com" },
  { pattern = "electricidadcarlospaz.proyectoswebsite.com/img/*", zone_name = "proyectoswebsite.com" },
]

[vars]
# En local se pisa con .dev.vars (http://localhost:3000).
ALLOWED_ORIGINS = "https://electricidadcarlospaz.proyectoswebsite.com"
AVISO_REMITENTE = "avisos@proyectoswebsite.com"

# Fotos: se guardan en Vercel Blob (secreto BLOB_READ_WRITE_TOKEN) y se sirven por /img/*
# de este dominio con la caché de Cloudflare.

# Aviso por email de cada consulta. Requiere Email Routing activo en proyectoswebsite.com
# con la dirección de destino verificada.
[[send_email]]
name = "AVISOS"
destination_address = "francohugoamador25@gmail.com"
